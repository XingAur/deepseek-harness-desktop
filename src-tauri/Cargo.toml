[package]
name = "deepseek-harness-desktop"
version = "0.1.0"
description = "Tauri desktop shell for DeepSeek Harness"
authors = ["DeepSeek Harness Desktop contributors"]
edition = "2024"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
ed25519-dalek = "2.2.0"
flate2 = "1.1.5"
futures-util = "0.3.31"
hex = "0.4.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1.12.2"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.44"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.16"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
tempfile = "3.23.0"
