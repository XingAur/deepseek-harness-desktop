appId: com.deepseek.dshdesktop
productName: DeepSeek Harness
directories:
  output: release
files:
  - dist/**
  - resources/**
  - "!resources/dsh/**"
  - "!resources/runtime-pnpm/**"
asarUnpack:
  - resources/dsh-runtime.tgz
  - resources/icon.ico
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: true
  perMachine: false
