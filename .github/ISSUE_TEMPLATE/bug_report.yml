name: Bug report / 问题反馈
description: Report a reproducible problem with DSH Desktop (official shell + local overlay) / 反馈可复现的 DSH Desktop 问题
body:
  - type: markdown
    attributes:
      value: |
        DSH Desktop is the official DeepSeek Harness desktop app plus a local overlay plugin. Reports about the official shell itself may belong upstream; reports about relay, model tools, OAuth, MCP, model proxy, Skills or portable packaging belong here.

        感谢你帮助改进 DSH Desktop。DSH Desktop = 官方 DeepSeek Harness 桌面应用 + 本地 overlay 插件；官方壳本身的问题可能属于上游，中继、模型工具、OAuth、MCP、模型代理、Skills、便携包相关问题请提交到这里。

        Please remove API keys, tokens, account details, and other sensitive data before attaching logs or screenshots.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Existing reports / 提交前查重
      description: Search open and closed issues before submitting / 请先搜索已打开和已关闭的 Issue
      options:
        - label: I searched existing issues and did not find the same problem / 我已搜索现有 Issue，没有发现相同问题
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area / 涉及区域
      options:
        - Relay or phone connection / 中继或手机连接
        - Model tools (probe, live models, selection) / 模型工具（测连接、拉模型、勾选显示）
        - Codex / xAI OAuth sign-in / Codex、xAI 登录
        - MCP cards / MCP 卡片
        - Model network proxy / 模型网络代理
        - Skills directory / Skills 目录
        - Portable packaging or release assets / 便携包或发布产物
        - Official app shell (window, tray, updates, accounts, scheduler) / 官方壳（窗口、托盘、更新、账号、调度）
        - Other or unknown / 其他或不确定
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system / 操作系统
      options:
        - Windows 11 x64
        - Windows 10 x64
        - macOS Apple Silicon
        - Other or unsupported / 其他或未支持平台
    validations:
      required: true

  - type: dropdown
    id: installation_method
    attributes:
      label: Installation method / 安装方式
      options:
        - Windows portable EXE (unsigned) / Windows 便携安装 EXE（未签名）
        - Windows portable ZIP / Windows 便携版 ZIP
        - macOS ad-hoc signed DMG / macOS ad-hoc 签名 DMG
        - macOS portable ZIP / macOS 便携版 ZIP
        - Official DeepSeek Harness app + overlay installed into a profile / 官方应用 + 手动挂载 overlay
        - Built from source / 源码运行
        - Other or unknown / 其他或不确定
    validations:
      required: true

  - type: input
    id: official_version
    attributes:
      label: Official DeepSeek Harness version / 官方 DeepSeek Harness 版本
      description: Shown in About, or in the asset name / 见「关于」或产物文件名
      placeholder: "For example: 0.2.1-rc.5; or Unknown / 不知道"
    validations:
      required: true

  - type: input
    id: build_version
    attributes:
      label: Portable build version / 便携包构建版本
      description: Present only for this repository's portable builds / 仅本仓库便携包需要填写
      placeholder: "For example: official-v0.2.1-rc.5.20261102.1; or N/A"

  - type: dropdown
    id: overlay_present
    attributes:
      label: Overlay state / overlay 状态
      description: Portable builds bundle the overlay; source installs add it to a profile / 便携包已内置 overlay；源码安装时挂到 profile
      options:
        - Bundled in a portable build / 便携包内置
        - Installed into a profile manually / 手动装进 profile
        - Not installed / 未安装
        - Unknown / 不确定
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: What happened? / 实际发生了什么？
      description: Include the exact error text when possible / 尽量包含准确的错误文字
      placeholder: Describe what you saw and when it happened / 描述现象及发生时机
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Start from a normal launch or installation / 从正常启动或安装开始描述
      placeholder: |
        1. Open ... / 打开……
        2. Click ... / 点击……
        3. Observe ... / 看到……

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior / 预期结果
      placeholder: What should have happened? / 正常情况下应该发生什么？

  - type: textarea
    id: logs
    attributes:
      label: Logs or error details / 日志或错误信息
      description: Paste relevant host logs (overlay prefixes its own lines), console output, or the failing HTTP response. Do not paste credentials / 粘贴相关 Host 日志（overlay 会带前缀）、控制台输出或失败响应；不要粘贴凭据
      placeholder: Paste the exact error lines or attach a text log / 粘贴准确报错行，或附加文本日志

  - type: textarea
    id: extra_context
    attributes:
      label: Additional context / 补充信息
      description: Relay deployment, proxy mode, official profile patch, recent updates, or anything else that may matter / 中继部署方式、代理模式、profile patch、最近更新等

  - type: checkboxes
    id: privacy_check
    attributes:
      label: Sensitive information / 敏感信息
      options:
        - label: I removed API keys, tokens, account details, and other sensitive data from my attachments / 我已从附件中移除 API Key、Token、账号信息等敏感内容
          required: true
