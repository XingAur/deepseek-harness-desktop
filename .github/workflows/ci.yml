name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # The overlay is the only product code in this repository: a Cordis bundle
  # loaded into the official desktop app. Its unit tests, host/client bundles
  # and layout guards must pass without an official source checkout.
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Install overlay dependencies
        working-directory: overlay
        run: npm ci --registry https://registry.npmjs.org
      - name: Bundle host and client faces
        working-directory: overlay
        run: |
          npm run bundle:host
          npm run bundle:client
      - name: Run overlay checks
        working-directory: overlay
        run: npm run check

  # Portable packaging scripts must stay syntactically valid and keep their
  # own unit tests green on a stock Linux runner. Full package builds run in
  # the release workflow on real Windows and macOS runners.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Syntax-check portable build scripts
        run: |
          set -euo pipefail
          for script in scripts/*.mjs; do node --check "$script"; done
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Run portable script unit tests
        run: |
          set -euo pipefail
          node --test scripts/test-finalize-portable-runtime.mjs scripts/test-repack-portable-asar.mjs
      - name: Reject developer paths in portable scripts
        run: |
          set -euo pipefail
          if grep -R -n -E '/Users/[^/]+/|nvm/versions|ln -sf' scripts --include='*.sh' --include='*.ps1' --exclude='check.sh'; then
            echo "portable scripts contain a developer path or source-link operation" >&2
            exit 1
          fi
