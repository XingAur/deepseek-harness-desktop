name: DeepSeek Harness Desktop

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            runtime_target: windows-x86_64
            runtime_extension: zip
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ''
          - name: macOS Apple Silicon
            runner: macos-15
            runtime_target: darwin-aarch64
            runtime_extension: tar.gz
            rust_target: aarch64-apple-darwin
            tauri_args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.runner }}
    env:
      DSH_DESKTOP_SIGNING_PUBLIC_KEY: ${{ secrets.DSH_DESKTOP_SIGNING_PUBLIC_KEY || 'cmFlmJvjXIrMN8AbIXxF2c6Gnpt9rDFd_Zhbl0U7AlI' }}
      DSH_DESKTOP_SIGNING_PRIVATE_KEY: ${{ secrets.DSH_DESKTOP_SIGNING_PRIVATE_KEY || 'wbAbExHsjryIT22fTuRA3W61tJdaXFC7YxoAeN9uKnQ' }}
      DSH_DESKTOP_RELEASE_PUBLIC_KEY: ${{ secrets.DSH_DESKTOP_SIGNING_PUBLIC_KEY || 'cmFlmJvjXIrMN8AbIXxF2c6Gnpt9rDFd_Zhbl0U7AlI' }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Require production Runtime keys for a tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test -n "${{ secrets.DSH_DESKTOP_SIGNING_PUBLIC_KEY }}"
          test -n "${{ secrets.DSH_DESKTOP_SIGNING_PRIVATE_KEY }}"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check TypeScript, UI and plugin
        run: npm run check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Sign curated community catalog
        run: node scripts/sign-catalog.mjs runtime/catalog/community.json runtime/catalog/community.json

      - name: Assemble managed Runtime
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [[ "${VERSION}" == "${GITHUB_REF_NAME}" ]]; then VERSION="0.1.0"; fi
          node scripts/build-runtime.mjs \
            --target=${{ matrix.runtime_target }} \
            --version="${VERSION}" \
            --url=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dsh-runtime-${{ matrix.runtime_target }}.${{ matrix.runtime_extension }}

      - name: Sign and stage Runtime manifest
        shell: bash
        run: |
          mkdir -p runtime/manifests
          node scripts/sign-manifest.mjs \
            runtime-build/${{ matrix.runtime_target }}/manifest-${{ matrix.runtime_target }}.unsigned.json \
            runtime/manifests/runtime-${{ matrix.runtime_target }}.json

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: ${{ matrix.tauri_args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: desktop-[platform]-[arch]-[bundle]

      - name: Upload Runtime release files
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.runtime_target }}
          path: |
            runtime-build/${{ matrix.runtime_target }}/dsh-runtime-${{ matrix.runtime_target }}.${{ matrix.runtime_extension }}
            runtime/manifests/runtime-${{ matrix.runtime_target }}.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "DeepSeek Harness Desktop ${{ github.ref_name }}" \
            --notes "Windows x64 与 macOS Apple Silicon 首版候选构建。"
          find release-assets -type f -print0 | xargs -0 gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}"
