name: DeepSeek Harness Desktop

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  MANAGED_RUNTIME_VERSION: 0.1.8-preview
  DSH_DESKTOP_RUNTIME_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/runtime-v0.1.8-preview/runtime-{target}.json

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            runtime_target: windows-x86_64
            runtime_extension: zip
            rust_target: x86_64-pc-windows-msvc
            tauri_args: '--config src-tauri/target/windows-installer/tauri.windows-installer.conf.json'
          - name: macOS Apple Silicon
            runner: macos-15
            runtime_target: darwin-aarch64
            runtime_extension: tar.gz
            rust_target: aarch64-apple-darwin
            tauri_args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.runner }}
    env:
      DSH_DESKTOP_SIGNING_PUBLIC_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DSH_DESKTOP_SIGNING_PUBLIC_KEY || 'cmFlmJvjXIrMN8AbIXxF2c6Gnpt9rDFd_Zhbl0U7AlI' }}
      DSH_DESKTOP_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DSH_DESKTOP_SIGNING_PRIVATE_KEY || 'wbAbExHsjryIT22fTuRA3W61tJdaXFC7YxoAeN9uKnQ' }}
      DSH_DESKTOP_RELEASE_PUBLIC_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DSH_DESKTOP_SIGNING_PUBLIC_KEY || 'cmFlmJvjXIrMN8AbIXxF2c6Gnpt9rDFd_Zhbl0U7AlI' }}
      TAURI_RELEASE_CONFIG_ARGS: ${{ startsWith(github.ref, 'refs/tags/') && '--config src-tauri/tauri.release.conf.json' || '' }}
      APPLE_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Require production signing keys for a tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "${{ secrets.DSH_DESKTOP_SIGNING_PUBLIC_KEY }}"
          test -n "${{ secrets.DSH_DESKTOP_SIGNING_PRIVATE_KEY }}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY}"
          # 更新器私钥为空密码：GitHub Secrets 无法保存空串，密码 Secret 未配置即视为空密码。

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check TypeScript, UI and plugin
        run: npm run check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Prepare ephemeral updater key for CI
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          CI_KEY="${RUNNER_TEMP}/dsh-ci-updater.key"
          npm run tauri -- signer generate --ci --write-keys "${CI_KEY}"
          TAURI_UPDATER_PUBLIC_KEY="$(cat "${CI_KEY}.pub")" node scripts/write-updater-config.mjs
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=${CI_KEY}"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD="
            echo "TAURI_RELEASE_CONFIG_ARGS=--config src-tauri/tauri.release.conf.json"
          } >> "${GITHUB_ENV}"

      - name: Prepare signed application updater config
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "${GITHUB_REF_NAME}" = "desktop-v${APP_VERSION}"
          node scripts/write-updater-config.mjs
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<DSH_UPDATER_PRIVATE_KEY"
            echo "${TAURI_SIGNING_PRIVATE_KEY}"
            echo "DSH_UPDATER_PRIVATE_KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<DSH_UPDATER_PASSWORD"
            echo "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
            echo "DSH_UPDATER_PASSWORD"
          } >> "${GITHUB_ENV}"

      - name: Assemble managed Runtime
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUNTIME_TAG="runtime-v${MANAGED_RUNTIME_VERSION}"
          RUNTIME_DIR="runtime-build/${{ matrix.runtime_target }}"
          ARCHIVE_NAME="dsh-runtime-${{ matrix.runtime_target }}.${{ matrix.runtime_extension }}"
          MANIFEST_NAME="runtime-${{ matrix.runtime_target }}.json"
          if gh release view "$RUNTIME_TAG" \
            --repo "${{ github.repository }}" >/dev/null 2>&1; then
            mkdir -p "$RUNTIME_DIR"
            gh release download "$RUNTIME_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "$ARCHIVE_NAME" \
              --pattern "$MANIFEST_NAME" \
              --dir "$RUNTIME_DIR"
            test -s "$RUNTIME_DIR/$ARCHIVE_NAME"
            test -s "$RUNTIME_DIR/$MANIFEST_NAME"
            touch "$RUNTIME_DIR/.managed-runtime-reused"
            echo "Reusing immutable Runtime assets from $RUNTIME_TAG."
          else
            node scripts/build-runtime.mjs \
              --target=${{ matrix.runtime_target }} \
              --version="${MANAGED_RUNTIME_VERSION}" \
              --url=https://github.com/${{ github.repository }}/releases/download/runtime-v${MANAGED_RUNTIME_VERSION}/dsh-runtime-${{ matrix.runtime_target }}.${{ matrix.runtime_extension }}
          fi

      - name: Sign and stage Runtime manifest
        shell: bash
        run: |
          mkdir -p runtime/manifests
          RUNTIME_DIR="runtime-build/${{ matrix.runtime_target }}"
          MANIFEST_NAME="runtime-${{ matrix.runtime_target }}.json"
          if test -f "$RUNTIME_DIR/.managed-runtime-reused"; then
            cp "$RUNTIME_DIR/$MANIFEST_NAME" "runtime/manifests/$MANIFEST_NAME"
          else
            node scripts/sign-manifest.mjs \
              "$RUNTIME_DIR/manifest-${{ matrix.runtime_target }}.unsigned.json" \
              "$RUNTIME_DIR/$MANIFEST_NAME"
            cp "$RUNTIME_DIR/$MANIFEST_NAME" "runtime/manifests/$MANIFEST_NAME"
          fi

      - name: Prepare Windows installer config
        if: runner.os == 'Windows'
        run: node scripts/windows-installer.mjs --prepare-config

      - name: Build Tauri installer
        if: runner.os != 'macOS' || env.APPLE_SIGNING_CONFIGURED != 'true'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: ${{ matrix.tauri_args }} ${{ env.TAURI_RELEASE_CONFIG_ARGS }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: DeepSeek Harness Desktop ${{ github.ref_name }}
          releaseBody: Windows x64 与 macOS Apple Silicon 候选构建，包含独立签名的应用更新与 Runtime 更新制品。
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: desktop-[platform]-[arch]-[bundle]

      - name: Build signed Tauri installer
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == 'true'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: ${{ matrix.tauri_args }} ${{ env.TAURI_RELEASE_CONFIG_ARGS }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: DeepSeek Harness Desktop ${{ github.ref_name }}
          releaseBody: Windows x64 与 macOS Apple Silicon 候选构建，包含独立签名的应用更新与 Runtime 更新制品。
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: desktop-[platform]-[arch]-[bundle]

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      - name: Upload Runtime release files
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.runtime_target }}
          path: |
            runtime-build/${{ matrix.runtime_target }}/dsh-runtime-${{ matrix.runtime_target }}.${{ matrix.runtime_extension }}
            runtime/manifests/runtime-${{ matrix.runtime_target }}.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: runtime-*
          merge-multiple: true
      - name: Add managed Runtime files to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUNTIME_TAG="runtime-v${MANAGED_RUNTIME_VERSION}"
          mapfile -d '' runtime_assets < <(
            find release-assets -type f \
              \( -name 'runtime-*.json' -o -name 'dsh-runtime-*' \) -print0
          )
          test "${#runtime_assets[@]}" -gt 0
          if ! gh release view "${RUNTIME_TAG}" \
            --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${RUNTIME_TAG}" \
              --repo "${{ github.repository }}" \
              --target "${GITHUB_SHA}" \
              --title "DeepSeek Harness Runtime ${MANAGED_RUNTIME_VERSION}" \
              --notes "Immutable managed Runtime assets for DeepSeek Harness Desktop." \
              --prerelease
          fi
          existing_assets="$(gh release view "${RUNTIME_TAG}" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name' || true)"
          uploaded_count=0
          existing_asset_dir="${RUNNER_TEMP}/dsh-existing-runtime-assets"
          mkdir -p "${existing_asset_dir}"
          for asset in "${runtime_assets[@]}"; do
            asset_name="$(basename "${asset}")"
            if grep -Fqx "${asset_name}" <<<"${existing_assets}"; then
              existing_asset="${existing_asset_dir}/${asset_name}"
              rm -f "${existing_asset}"
              gh release download "${RUNTIME_TAG}" \
                --repo "${{ github.repository }}" \
                --pattern "${asset_name}" \
                --dir "${existing_asset_dir}"
              if ! cmp -s "${asset}" "${existing_asset}"; then
                echo "::error::Existing Runtime asset differs from the newly signed asset: ${asset_name}. Use a new immutable Runtime version."
                exit 1
              fi
              echo "Verified existing Runtime asset: ${asset_name}"
              continue
            fi
            gh release upload "${RUNTIME_TAG}" \
              --repo "${{ github.repository }}" \
              "${asset}"
            existing_assets+=$'\n'"${asset_name}"
            uploaded_count=$((uploaded_count + 1))
          done
          echo "Uploaded ${uploaded_count} new Runtime asset(s)."
