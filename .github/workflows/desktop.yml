name: DeepSeek Harness Desktop

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/desktop.yml'
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            runtime_target: windows-x86_64
            runtime_extension: zip
            rust_target: x86_64-pc-windows-msvc
            tauri_args: '--config src-tauri/target/windows-installer/tauri.windows-installer.conf.json'
            bundle_glob: 'src-tauri/target/release/bundle/nsis/*'
          - name: macOS Apple Silicon
            runner: macos-15
            runtime_target: darwin-aarch64
            runtime_extension: tar.gz
            rust_target: aarch64-apple-darwin
            tauri_args: '--target aarch64-apple-darwin'
            bundle_glob: 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg'
    runs-on: ${{ matrix.runner }}
    env:
      DSH_DESKTOP_SIGNING_PUBLIC_KEY: ${{ secrets.DSH_DESKTOP_SIGNING_PUBLIC_KEY || 'cmFlmJvjXIrMN8AbIXxF2c6Gnpt9rDFd_Zhbl0U7AlI' }}
      DSH_DESKTOP_RELEASE_PUBLIC_KEY: ${{ secrets.DSH_DESKTOP_SIGNING_PUBLIC_KEY || 'cmFlmJvjXIrMN8AbIXxF2c6Gnpt9rDFd_Zhbl0U7AlI' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read and validate release versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          DESKTOP_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('release/versions.json')).desktopVersion")"
          node -e "const v=JSON.parse(require('fs').readFileSync('release/versions.json')); for (const [key,value] of Object.entries({DESKTOP_VERSION:v.desktopVersion,MANAGED_RUNTIME_VERSION:v.runtimeVersion,NODE_VERSION:v.nodeVersion})) console.log(key+'='+value)" >> "${GITHUB_ENV}"
          node -e "const v=JSON.parse(require('fs').readFileSync('release/versions.json')); console.log('node_version='+v.nodeVersion)" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
            test "${GITHUB_REF_TYPE}" = 'tag'
            test "${GITHUB_REF_NAME}" = "desktop-v${DESKTOP_VERSION}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps

      - name: Create ephemeral Runtime signing keys for pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node -e "const {generateKeyPairSync}=require('crypto'); const {privateKey,publicKey}=generateKeyPairSync('ed25519'); const privateJwk=privateKey.export({format:'jwk'}); const publicJwk=publicKey.export({format:'jwk'}); for (const [key,value] of Object.entries({DSH_DESKTOP_SIGNING_PUBLIC_KEY:publicJwk.x,DSH_DESKTOP_SIGNING_PRIVATE_KEY:privateJwk.d,DSH_DESKTOP_RELEASE_PUBLIC_KEY:publicJwk.x})) console.log(key+'='+value)" >> "${GITHUB_ENV}"

      - name: Verify source and platform contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run release:versions:check
          npm run check
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Require immutable Runtime signing keys for a release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RUNTIME_SIGNING_PUBLIC_KEY: ${{ secrets.DSH_DESKTOP_SIGNING_PUBLIC_KEY }}
          RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.DSH_DESKTOP_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "${RUNTIME_SIGNING_PUBLIC_KEY}"
          test -n "${RUNTIME_SIGNING_PRIVATE_KEY}"

      - name: Require Windows application updater signing key
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "${TAURI_UPDATER_PUBLIC_KEY}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY}"

      - name: Assemble managed Runtime
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUNTIME_TAG="runtime-v${MANAGED_RUNTIME_VERSION}"
          RUNTIME_DIR="runtime-build/${{ matrix.runtime_target }}"
          ARCHIVE_NAME="dsh-runtime-${{ matrix.runtime_target }}.${{ matrix.runtime_extension }}"
          MANIFEST_NAME="runtime-${{ matrix.runtime_target }}.json"
          if gh release view "${RUNTIME_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease,assets > "${RUNNER_TEMP}/runtime-release-${{ matrix.runtime_target }}.json" 2>/dev/null; then
            mkdir -p "${RUNTIME_DIR}"
            IS_DRAFT="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).isDraft" "${RUNNER_TEMP}/runtime-release-${{ matrix.runtime_target }}.json")"
            ARCHIVE_EXISTS="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).assets.some(a => a.name === process.argv[2])" "${RUNNER_TEMP}/runtime-release-${{ matrix.runtime_target }}.json" "${ARCHIVE_NAME}")"
            MANIFEST_EXISTS="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).assets.some(a => a.name === process.argv[2])" "${RUNNER_TEMP}/runtime-release-${{ matrix.runtime_target }}.json" "${MANIFEST_NAME}")"
            if [[ "${IS_DRAFT}" != 'true' && ( "${ARCHIVE_EXISTS}" != 'true' || "${MANIFEST_EXISTS}" != 'true' ) ]]; then
              echo '::error::Public Runtime Release is incomplete and immutable.'
              exit 1
            fi
            if [[ "${ARCHIVE_EXISTS}" == 'true' ]]; then
              gh release download "${RUNTIME_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${ARCHIVE_NAME}" --dir "${RUNTIME_DIR}"
              test -s "${RUNTIME_DIR}/${ARCHIVE_NAME}"
            fi
            if [[ "${MANIFEST_EXISTS}" == 'true' ]]; then
              gh release download "${RUNTIME_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${MANIFEST_NAME}" --dir "${RUNTIME_DIR}"
              test -s "${RUNTIME_DIR}/${MANIFEST_NAME}"
            fi
            if [[ "${ARCHIVE_EXISTS}" == 'true' && "${MANIFEST_EXISTS}" == 'true' ]]; then
              touch "${RUNTIME_DIR}/.managed-runtime-reused"
            elif [[ "${ARCHIVE_EXISTS}" == 'true' ]]; then
              node scripts/runtime-release-manifest.mjs \
                --archive="${RUNTIME_DIR}/${ARCHIVE_NAME}" \
                --target=${{ matrix.runtime_target }} \
                --version="${MANAGED_RUNTIME_VERSION}" \
                --url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RUNTIME_TAG}/${ARCHIVE_NAME}" \
                --output="${RUNTIME_DIR}/manifest-${{ matrix.runtime_target }}.unsigned.json"
            elif [[ "${MANIFEST_EXISTS}" == 'true' ]]; then
              echo '::error::Runtime draft contains a manifest without its immutable archive.'
              exit 1
            else
              node scripts/build-runtime.mjs \
                --target=${{ matrix.runtime_target }} \
                --version="${MANAGED_RUNTIME_VERSION}" \
                --url=https://github.com/${GITHUB_REPOSITORY}/releases/download/runtime-v${MANAGED_RUNTIME_VERSION}/${ARCHIVE_NAME}
            fi
          else
            node scripts/build-runtime.mjs \
              --target=${{ matrix.runtime_target }} \
              --version="${MANAGED_RUNTIME_VERSION}" \
              --url=https://github.com/${GITHUB_REPOSITORY}/releases/download/runtime-v${MANAGED_RUNTIME_VERSION}/${ARCHIVE_NAME}
          fi

      - name: Sign and stage Runtime manifest
        shell: bash
        env:
          RELEASE_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.DSH_DESKTOP_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
            export DSH_DESKTOP_SIGNING_PRIVATE_KEY="${RELEASE_RUNTIME_SIGNING_PRIVATE_KEY}"
          fi
          mkdir -p runtime/manifests
          RUNTIME_DIR="runtime-build/${{ matrix.runtime_target }}"
          ARCHIVE_NAME="dsh-runtime-${{ matrix.runtime_target }}.${{ matrix.runtime_extension }}"
          MANIFEST_NAME="runtime-${{ matrix.runtime_target }}.json"
          if test -f "${RUNTIME_DIR}/.managed-runtime-reused"; then
            cp "${RUNTIME_DIR}/${MANIFEST_NAME}" "runtime/manifests/${MANIFEST_NAME}"
          else
            node scripts/sign-manifest.mjs \
              "${RUNTIME_DIR}/manifest-${{ matrix.runtime_target }}.unsigned.json" \
              "${RUNTIME_DIR}/${MANIFEST_NAME}"
            cp "${RUNTIME_DIR}/${MANIFEST_NAME}" "runtime/manifests/${MANIFEST_NAME}"
          fi
          cp "${RUNTIME_DIR}/${ARCHIVE_NAME}" "runtime/${ARCHIVE_NAME}"

      - name: Verify Runtime manifest
        shell: bash
        run: |
          node scripts/verify-runtime-manifest.mjs \
            "runtime/manifests/runtime-${{ matrix.runtime_target }}.json" \
            "runtime/dsh-runtime-${{ matrix.runtime_target }}.${{ matrix.runtime_extension }}" \
            "${{ matrix.runtime_target }}" \
            "${MANAGED_RUNTIME_VERSION}"

      - name: Prepare Windows application updater config
        id: updater_config
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            CI_KEY="${RUNNER_TEMP}/dsh-ci-updater.key"
            npm run tauri -- signer generate --ci --write-keys "${CI_KEY}"
            TAURI_UPDATER_PUBLIC_KEY="$(cat "${CI_KEY}.pub")"
            echo "ci_private_key=${CI_KEY}" >> "${GITHUB_OUTPUT}"
            echo "ci_public_key=${TAURI_UPDATER_PUBLIC_KEY}" >> "${GITHUB_OUTPUT}"
          fi
          TAURI_UPDATER_PUBLIC_KEY="${TAURI_UPDATER_PUBLIC_KEY}" \
            node scripts/write-updater-config.mjs --platform=windows-x86_64

      - name: Prepare macOS manual-update bundle config
        if: runner.os == 'macOS'
        run: node scripts/write-updater-config.mjs --platform=darwin-aarch64

      - name: Prepare Windows installer config
        if: runner.os == 'Windows'
        env:
          DSH_DESKTOP_RUNTIME_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/runtime-v${{ env.MANAGED_RUNTIME_VERSION }}/runtime-{target}.json
        run: node scripts/windows-installer.mjs --prepare-config

      - name: Build Tauri bundle without publishing
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.os == 'Windows' && (steps.updater_config.outputs.ci_private_key || secrets.TAURI_SIGNING_PRIVATE_KEY) || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.tauri_args }}
          retryAttempts: 3

      - name: Verify macOS application bundle entrypoint
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          MACOS_DISK_IMAGES=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ "${#MACOS_DISK_IMAGES[@]}" -ne 1 ]]; then
            echo '::error::Expected exactly one macOS disk image.'
            find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -print
            exit 1
          fi
          MOUNT_POINT="${RUNNER_TEMP}/dsh-macos-app"
          mkdir -p "${MOUNT_POINT}"
          hdiutil attach -readonly -nobrowse -mountpoint "${MOUNT_POINT}" "${MACOS_DISK_IMAGES[0]}"
          trap 'hdiutil detach "${MOUNT_POINT}"' EXIT
          APP_BUNDLES=("${MOUNT_POINT}"/*.app)
          if [[ "${#APP_BUNDLES[@]}" -ne 1 ]]; then
            echo '::error::Expected exactly one macOS application bundle inside the disk image.'
            find "${MOUNT_POINT}" -maxdepth 1 -print
            exit 1
          fi
          APP_BUNDLE="${APP_BUNDLES[0]}"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_BUNDLE}/Contents/Info.plist")"
          test "${EXECUTABLE_NAME}" = 'deepseek-harness-desktop'
          EXECUTABLE_PATH="${APP_BUNDLE}/Contents/MacOS/${EXECUTABLE_NAME}"
          test -x "${EXECUTABLE_PATH}"
          file "${EXECUTABLE_PATH}" | grep -q 'arm64'
          if test -e "${APP_BUNDLE}/Contents/MacOS/verify_updater_signature"; then
            echo '::error::The internal updater verifier must not be bundled as the macOS application entrypoint.'
            exit 1
          fi
          hdiutil detach "${MOUNT_POINT}"
          trap - EXIT

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-stage/desktop release-stage/runtime
          shopt -s nullglob
          if [[ "${{ matrix.runtime_target }}" == 'windows-x86_64' ]]; then
            windows_installers=(src-tauri/target/release/bundle/nsis/*_x64-setup.exe)
            windows_updater_signatures=(src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig)
            if [[ "${#windows_installers[@]}" -ne 1 || "${#windows_updater_signatures[@]}" -ne 1 ]]; then
              echo '::error::Expected exactly one Windows NSIS installer and its updater signature.'
              find src-tauri/target/release/bundle/nsis -maxdepth 1 -type f -print
              exit 1
            fi
            cp "${windows_installers[0]}" "${windows_updater_signatures[0]}" release-stage/desktop/
          else
            macos_disk_images=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*_aarch64.dmg)
            test "${#macos_disk_images[@]}" -eq 1
            cp "${macos_disk_images[0]}" release-stage/desktop/
          fi
          cp "runtime-build/${{ matrix.runtime_target }}/dsh-runtime-${{ matrix.runtime_target }}.${{ matrix.runtime_extension }}" release-stage/runtime/
          cp "runtime/manifests/runtime-${{ matrix.runtime_target }}.json" release-stage/runtime/

      - name: Verify Windows updater signature against the bundled public key
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ steps.updater_config.outputs.ci_public_key || secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mapfile -d '' updater_installers < <(find release-stage/desktop -maxdepth 1 -type f -name '*_x64-setup.exe' -print0)
          mapfile -d '' updater_signatures < <(find release-stage/desktop -maxdepth 1 -type f -name '*_x64-setup.exe.sig' -print0)
          test "${#updater_installers[@]}" -eq 1
          test "${#updater_signatures[@]}" -eq 1
          cargo run --locked --manifest-path src-tauri/Cargo.toml --features updater-verifier-cli --bin verify_updater_signature -- \
            "${updater_installers[0]}" "${updater_signatures[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime_target }}
          path: release-stage
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate tagged versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          DESKTOP_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('release/versions.json')).desktopVersion")"
          node -e "const v=JSON.parse(require('fs').readFileSync('release/versions.json')); for (const [key,value] of Object.entries({DESKTOP_VERSION:v.desktopVersion,MANAGED_RUNTIME_VERSION:v.runtimeVersion,NODE_VERSION:v.nodeVersion})) console.log(key+'='+value)" >> "${GITHUB_ENV}"
          node -e "const v=JSON.parse(require('fs').readFileSync('release/versions.json')); console.log('node_version='+v.nodeVersion)" >> "${GITHUB_OUTPUT}"
          test "${GITHUB_REF_TYPE}" = 'tag'
          test "${GITHUB_REF_NAME}" = "desktop-v${DESKTOP_VERSION}"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node_version }}

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Upload or verify immutable Runtime assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUNTIME_TAG="runtime-v${MANAGED_RUNTIME_VERSION}"
          if gh release view "${RUNTIME_TAG}" --json isDraft,isPrerelease,assets > "${RUNNER_TEMP}/runtime-release-before.json" 2>/dev/null; then
            IS_DRAFT="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).isDraft" "${RUNNER_TEMP}/runtime-release-before.json")"
            IS_PRERELEASE="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).isPrerelease" "${RUNNER_TEMP}/runtime-release-before.json")"
            ASSET_COUNT="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).assets.length" "${RUNNER_TEMP}/runtime-release-before.json")"
            if [[ "${IS_DRAFT}" != 'true' && ( "${IS_PRERELEASE}" != 'true' || "${ASSET_COUNT}" != '4' ) ]]; then
              echo '::error::Public Runtime Release is incomplete or not marked prerelease; automatic mutation is blocked.'
              exit 1
            fi
          else
            gh release create "${RUNTIME_TAG}" --draft --prerelease --target "${GITHUB_SHA}" --title "DeepSeek Harness Runtime ${MANAGED_RUNTIME_VERSION}" --notes 'Immutable managed Runtime assets for DeepSeek Harness Desktop.'
            IS_DRAFT=true
          fi
          existing_names="$(gh release view "${RUNTIME_TAG}" --json assets --jq '.assets[].name' || true)"
          existing_dir="${RUNNER_TEMP}/existing-runtime"
          mkdir -p "${existing_dir}"
          runtime_assets=()
          for name in \
            dsh-runtime-darwin-aarch64.tar.gz \
            runtime-darwin-aarch64.json \
            dsh-runtime-windows-x86_64.zip \
            runtime-windows-x86_64.json; do
            mapfile -d '' matches < <(find release-assets -type f -name "${name}" -print0)
            test "${#matches[@]}" -eq 1
            runtime_assets+=("${matches[0]}")
          done
          for asset in "${runtime_assets[@]}"; do
            name="$(basename "${asset}")"
            if grep -Fqx "${name}" <<<"${existing_names}"; then
              gh release download "${RUNTIME_TAG}" --pattern "${name}" --dir "${existing_dir}"
              cmp -s "${asset}" "${existing_dir}/${name}" || { echo "::error::Immutable Runtime asset differs: ${name}"; exit 1; }
            else
              test "${IS_DRAFT}" = 'true'
              gh release upload "${RUNTIME_TAG}" "${asset}"
              existing_names+=$'\n'"${name}"
            fi
          done
          for asset in "${runtime_assets[@]}"; do
            grep -Fqx "$(basename "${asset}")" <<<"${existing_names}"
          done
          expected_runtime_names=(
            dsh-runtime-darwin-aarch64.tar.gz
            dsh-runtime-windows-x86_64.zip
            runtime-darwin-aarch64.json
            runtime-windows-x86_64.json
          )
          expected_runtime_file="${RUNNER_TEMP}/expected-runtime-assets.txt"
          final_runtime_file="${RUNNER_TEMP}/final-runtime-assets.txt"
          printf '%s\n' "${expected_runtime_names[@]}" > "${expected_runtime_file}"
          runtime_assets_visible=false
          for attempt in {1..12}; do
            if gh release view "${RUNTIME_TAG}" --json assets --jq '.assets[].name' | sort > "${final_runtime_file}" && \
              cmp -s "${expected_runtime_file}" "${final_runtime_file}"; then
              runtime_assets_visible=true
              break
            fi
            sleep 2
          done
          if [[ "${runtime_assets_visible}" != 'true' ]]; then
            echo '::error::Runtime Release asset list was not consistent after 12 attempts.'
            diff -u "${expected_runtime_file}" "${final_runtime_file}" || true
            exit 1
          fi
          if [[ "${IS_DRAFT}" == 'true' ]]; then
            gh release edit "${RUNTIME_TAG}" --draft=false --prerelease
          fi

      - name: Collect exact desktop assets and generate metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-assets release-output
          mapfile -d '' desktop_candidates < <(find release-assets -type f \
            \( -name '*_x64-setup.exe' -o -name '*_x64-setup.exe.sig' -o -name '*_aarch64.dmg' \) -print0)
          test "${#desktop_candidates[@]}" -eq 3
          for asset in "${desktop_candidates[@]}"; do
            case "${asset}" in
              *_x64-setup.exe)
                destination="desktop-assets/DeepSeek.Harness.Desktop_${DESKTOP_VERSION}_x64-setup.exe"
                ;;
              *_x64-setup.exe.sig)
                destination="desktop-assets/DeepSeek.Harness.Desktop_${DESKTOP_VERSION}_x64-setup.exe.sig"
                ;;
              *_aarch64.dmg)
                destination="desktop-assets/DeepSeek.Harness.Desktop_${DESKTOP_VERSION}_aarch64.dmg"
                ;;
              *)
                echo "::error::Unsupported desktop asset: ${asset}"
                exit 1
                ;;
            esac
            test ! -e "${destination}"
            cp "${asset}" "${destination}"
          done
          PUBLISHED_AT="$(node -e "process.stdout.write(new Date(process.argv[1]).toISOString())" "$(git show -s --format=%cI "${GITHUB_REF_NAME}")")"
          node scripts/desktop-release.mjs \
            --assets=desktop-assets \
            --output=release-output \
            --repository="${GITHUB_REPOSITORY}" \
            --published-at="${PUBLISHED_AT}" \
            --notes='Automated DeepSeek Harness upstream release. macOS Apple Silicon DMG is not Developer ID signed or notarized.'
          test -s release-output/latest.json
          test -s release-output/desktop-release.json

      - name: Create or validate desktop draft
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DESKTOP_TAG="desktop-v${DESKTOP_VERSION}"
          release_ids_file="${RUNNER_TEMP}/desktop-release-ids.txt"
          load_desktop_release_ids() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${DESKTOP_TAG}\") | .id" > "${release_ids_file}"
            mapfile -t DESKTOP_RELEASE_IDS < "${release_ids_file}"
          }
          load_desktop_release_ids
          if [[ "${#DESKTOP_RELEASE_IDS[@]}" -gt 1 ]]; then
            echo "::error::Multiple desktop Releases use ${DESKTOP_TAG}; automatic publication is blocked."
            exit 1
          fi
          if [[ "${#DESKTOP_RELEASE_IDS[@]}" -eq 1 ]]; then
            DESKTOP_RELEASE_ID="${DESKTOP_RELEASE_IDS[0]}"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${DESKTOP_RELEASE_ID}" > "${RUNNER_TEMP}/desktop-release-before.json"
            IS_DRAFT="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).draft" "${RUNNER_TEMP}/desktop-release-before.json")"
            HAS_MARKER="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).assets.some(a => a.name === 'desktop-release.json')" "${RUNNER_TEMP}/desktop-release-before.json")"
            if [[ "${IS_DRAFT}" != 'true' && "${HAS_MARKER}" != 'true' ]]; then
              echo '::error::Public desktop Release is incomplete; automatic mutation is blocked.'
              exit 1
            fi
          else
            gh release create "${DESKTOP_TAG}" --draft --target "${GITHUB_SHA}" --title "DeepSeek Harness Desktop ${DESKTOP_VERSION}" --notes 'Windows x64 supports signed in-app updates. The macOS Apple Silicon DMG is not Developer ID signed or notarized and is updated by manual replacement.'
            IS_DRAFT=true
            DESKTOP_RELEASE_ID=''
            for attempt in {1..12}; do
              load_desktop_release_ids
              if [[ "${#DESKTOP_RELEASE_IDS[@]}" -gt 1 ]]; then
                echo "::error::Multiple desktop Releases use ${DESKTOP_TAG}; automatic publication is blocked."
                exit 1
              fi
              if [[ "${#DESKTOP_RELEASE_IDS[@]}" -eq 1 ]]; then
                DESKTOP_RELEASE_ID="${DESKTOP_RELEASE_IDS[0]}"
                break
              fi
              sleep 2
            done
            if [[ -z "${DESKTOP_RELEASE_ID}" ]]; then
              echo '::error::Desktop Release ID was not visible after 12 attempts.'
              exit 1
            fi
          fi
          echo "is_draft=${IS_DRAFT}" >> "${GITHUB_OUTPUT}"
          echo "release_id=${DESKTOP_RELEASE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Upload or verify immutable desktop assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DESKTOP_TAG="desktop-v${DESKTOP_VERSION}"
          DESKTOP_RELEASE_ID="${{ steps.draft.outputs.release_id }}"
          release_json="${RUNNER_TEMP}/desktop-release-assets.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${DESKTOP_RELEASE_ID}" > "${release_json}"
          existing_names="$(node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1])); for (const asset of r.assets) console.log(asset.name)" "${release_json}")"
          existing_dir="${RUNNER_TEMP}/existing-desktop"
          mkdir -p "${existing_dir}"
          desktop_assets=(desktop-assets/* release-output/latest.json release-output/desktop-release.json)
          test "${#desktop_assets[@]}" -eq 5
          for asset in "${desktop_assets[@]}"; do
            name="$(basename "${asset}")"
            if grep -Fqx "${name}" <<<"${existing_names}"; then
              asset_id="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).assets.find(a => a.name === process.argv[2])?.id || ''" "${release_json}" "${name}")"
              test -n "${asset_id}"
              gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                -H 'Accept: application/octet-stream' > "${existing_dir}/${name}"
              cmp -s "${asset}" "${existing_dir}/${name}" || { echo "::error::Immutable desktop asset differs: ${name}"; exit 1; }
            else
              test "${{ steps.draft.outputs.is_draft }}" = 'true'
              gh release upload "${DESKTOP_TAG}" "${asset}"
              existing_names+=$'\n'"${name}"
            fi
          done
          for asset in "${desktop_assets[@]}"; do
            grep -Fqx "$(basename "${asset}")" <<<"${existing_names}"
          done
          expected_desktop_file="${RUNNER_TEMP}/expected-desktop-assets.txt"
          final_desktop_file="${RUNNER_TEMP}/final-desktop-assets.txt"
          for asset in "${desktop_assets[@]}"; do basename "${asset}"; done | sort > "${expected_desktop_file}"
          desktop_assets_visible=false
          for attempt in {1..12}; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/${DESKTOP_RELEASE_ID}" --jq '.assets[].name' | sort > "${final_desktop_file}" && \
              cmp -s "${expected_desktop_file}" "${final_desktop_file}"; then
              desktop_assets_visible=true
              break
            fi
            sleep 2
          done
          if [[ "${desktop_assets_visible}" != 'true' ]]; then
            echo '::error::Desktop Release asset list was not consistent after 12 attempts.'
            diff -u "${expected_desktop_file}" "${final_desktop_file}" || true
            exit 1
          fi
          test -s release-output/latest.json
          test -s release-output/desktop-release.json

      - name: Publish complete desktop release
        if: steps.draft.outputs.is_draft == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ steps.draft.outputs.release_id }}" \
            -F draft=false -f make_latest=true > /dev/null
