name: Release

# 手动触发(可在 Actions 页面选分支)或推送 v* 标签触发:
# Windows: 完整门禁后产出 NSIS 安装包与便携版。
# macOS: 完整门禁后产出通用(unsigned) DMG。
# 产物不经 Actions artifacts(账号存储配额会挡住上传),而是由各构建 job
# 直接上传到先建好的草稿 Release;publish 仅把草稿转正,deploy 从 Release
# 下载资产同步自建更新服务器。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签(例如 v2.0.11);留空则按 dsh-plugin-desktop 的版本号推导'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 解析标签并确保草稿 Release 存在;构建 job 向它直传资产。
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./dsh-plugin-desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG"; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "DSH Desktop $TAG" \
              --notes "Windows 安装包(NSIS Setup)与便携版(Portable zip)、macOS 通用 DMG(未签名)。

          本 Release 由 Release workflow 构建并上传:完整打包门禁(check:win-package / check:mac-package)通过后才产出。macOS 签名与公证为手工步骤,DMG 首次打开需在系统设置中允许。"
          fi

  # 与 ci.yml 的 desktop-windows 相同的门禁链(check:win-package + dist),
  # 差别仅在产物去向:这里的 exe/zip 直传草稿 Release。
  release-windows:
    needs: [prepare-release]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [dsh-plugin-desktop]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace ${{ matrix.workspace }} check:win-package
      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:win-portable
      - name: Upload installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find "${{ matrix.workspace }}/dist" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \) -print0 |
          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            case "$base" in
              DSH-Desktop-Beta-*) prefix="beta-" ;;
              *) prefix="stable-" ;;
            esac
            cp "$file" "release/${prefix}${base}"
          done
          ls -l release
          gh release upload "$TAG" release/* --clobber

  # 与 release-windows 同构的 macOS 链:完整 mac 门禁(check:mac-package)后产出
  # 通用(unsigned)DMG,直传草稿 Release。签名与公证仍是在有凭据机器上的手工步骤。
  release-macos:
    needs: [prepare-release]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [dsh-plugin-desktop]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace ${{ matrix.workspace }} check:mac-package
      - name: Build macOS DMG (unsigned universal)
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:mac-smoke
      - name: Upload DMG to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find "${{ matrix.workspace }}/dist/mac-smoke" -type f -name '*.dmg' -print0 |
          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            case "$base" in
              DSH-Desktop-Beta-*) prefix="beta-" ;;
              *) prefix="stable-" ;;
            esac
            cp "$file" "release/${prefix}${base}"
          done
          ls -l release
          gh release upload "$TAG" release/* --clobber

  # 两个平台的资产都到齐后,把草稿转正。
  publish:
    needs: [prepare-release, release-windows, release-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: gh release edit "$TAG" --draft=false

  # 把 stable 安装包与版本清单同步到自建更新服务器(国内直连,应用内检查更新
  # 与下载都指向它)。SSH 私钥经 UPDATE_SERVER_* secrets 注入,仅此任务可见。
  # 未配置 UPDATE_SERVER_* secrets 的仓库(如下游 fork)自动跳过,不部署也不报错。
  # 资产从已发布的 Release 下载,不经 Actions artifacts。
  deploy-updates:
    needs: [prepare-release, publish]
    runs-on: ubuntu-latest
    env:
      UPDATE_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if ! gh release download "$TAG" --dir artifacts \
              --pattern 'stable-*-x64-Setup.exe' --pattern 'stable-*.dmg'; then
            echo 'release assets not found'; exit 1
          fi
          ls -l artifacts
      - name: Upload installers to the update server
        if: ${{ env.UPDATE_HOST != '' }}
        env:
          UPDATE_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
          UPDATE_USER: ${{ secrets.UPDATE_SERVER_USER }}
          UPDATE_KEY: ${{ secrets.UPDATE_SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./dsh-plugin-desktop/package.json').version")
          exe=$(find artifacts -type f -name '*-x64-Setup.exe' | head -n 1)
          dmg=$(find artifacts -type f -name '*.dmg' | head -n 1)
          test -n "$exe" || { echo 'stable setup exe not found'; exit 1; }
          test -n "$dmg" || { echo 'stable dmg not found'; exit 1; }
          # base64 round-trip keeps the OpenSSH key byte-exact across runners
          install -m 600 /dev/null key.b64
          printf '%s' "$UPDATE_KEY" > key.b64
          base64 -d key.b64 > key && chmod 600 key
          ssh_key_args=(-i "$PWD/key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30)
          scp "${ssh_key_args[@]}" "$exe" "$UPDATE_USER@$UPDATE_HOST:/var/www/dsh-updates/DSH-Desktop-windows-latest.exe"
          scp "${ssh_key_args[@]}" "$dmg" "$UPDATE_USER@$UPDATE_HOST:/var/www/dsh-updates/DSH-Desktop-mac-latest.dmg"
          printf '{"version":"%s","channel":"stable"}' "$version" > latest.json
          scp "${ssh_key_args[@]}" latest.json "$UPDATE_USER@$UPDATE_HOST:/var/www/dsh-updates/latest.json"
          ssh "${ssh_key_args[@]}" "$UPDATE_USER@$UPDATE_HOST" 'chown caddy:caddy /var/www/dsh-updates/* 2>/dev/null || true'
          echo "update server now serves $version"
