name: Release Official DSH Portable

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version beginning with the locked official version'
        required: true
        type: string
      release_tag:
        description: 'Release tag; must equal official-v<build_version>'
        required: true
        type: string
      publish:
        description: 'Publish after both platform builds pass; otherwise leave a draft'
        required: true
        default: true
        type: boolean
      notes:
        description: 'Chinese release notes (Markdown) for this build; overrides the default Chinese body'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: official-portable-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_version: ${{ steps.release.outputs.build_version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Validate version and create draft release
        id: release
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          official_version=$(node -p "require('./official-lock.json').version")
          case "$BUILD_VERSION" in
            "$official_version"_[0-9][0-9]) ;;
            *) echo "build_version must be ${official_version}_<NN> (for example ${official_version}_01)" >&2; exit 1 ;;
          esac
          expected="official-v$BUILD_VERSION"
          test "$RELEASE_TAG" = "$expected" || { echo "release_tag must equal $expected" >&2; exit 1; }
          if gh release view "$RELEASE_TAG" --json isDraft,databaseId --jq '{isDraft,databaseId}' >/tmp/release-draft.json 2>/dev/null; then
            test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/release-draft.json','utf8')).isDraft")" = true \
              || { echo 'existing release is already published' >&2; exit 1; }
            # Drafts may be untagged, so /releases/tags/{tag} and git tag PATCH are unreliable.
            release_id="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/release-draft.json','utf8')).databaseId")"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --method DELETE >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" --method DELETE >/dev/null 2>/dev/null || true
          fi
          notes_file="$(mktemp)"
          if [ -n "${RELEASE_NOTES:-}" ]; then
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          else
            cat > "$notes_file" <<EOF
          便携版 DeepSeek Harness，基于锁定的官方源码构建，内置本地 Overlay 与 MCP 管理器。

          - 官方基线：${official_version}
          - 构建版本：${BUILD_VERSION}
          - 更新方式：手动更新，不接入自动更新 feed

          Windows 产物未签名，macOS 产物为 ad-hoc 签名且未公证。请按平台下载对应的安装包或 ZIP。
          EOF
          fi
          gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" \
            --title "DSH 便携版 $BUILD_VERSION" \
            --notes-file "$notes_file"
          rm -f "$notes_file"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      - run: corepack enable
      - name: Require Windows x64 runner
        shell: pwsh
        run: |
          if (-not $IsWindows -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'Windows x64 runner required'
          }
      - name: Check out locked official source
        shell: pwsh
        run: |
          $lock = Get-Content official-lock.json -Raw | ConvertFrom-Json
          New-Item deepseek-harness -ItemType Directory -Force | Out-Null
          git -C deepseek-harness init
          git -C deepseek-harness remote add origin $lock.repository
          git -C deepseek-harness fetch --depth 1 origin $lock.commit
          git -C deepseek-harness checkout --detach FETCH_HEAD
          if ((git -C deepseek-harness rev-parse HEAD).Trim() -ne $lock.commit) { throw 'official commit mismatch' }
      - name: Build Windows x64 portable ZIP and EXE
        shell: pwsh
        env:
          DSH_PORTABLE_BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          DSH_PORTABLE_NPM_REGISTRY: https://registry.npmjs.org
          DSH_GITHUB_ASSET_MIRROR: ''
        run: ./scripts/build-portable-windows-x64.ps1
      - name: Upload Windows assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
          gh release upload "$TAG" dist/* --clobber

  build-macos:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      - run: corepack enable
      - name: Require macOS ARM64 runner
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - name: Check out locked official source
        shell: bash
        run: |
          set -euo pipefail
          repository=$(node -p "require('./official-lock.json').repository")
          commit=$(node -p "require('./official-lock.json').commit")
          mkdir -p deepseek-harness
          git -C deepseek-harness init
          git -C deepseek-harness remote add origin "$repository"
          git -C deepseek-harness fetch --depth 1 origin "$commit"
          git -C deepseek-harness checkout --detach FETCH_HEAD
          test "$(git -C deepseek-harness rev-parse HEAD)" = "$commit"
      - name: Build macOS ARM64 portable DMG and ZIP
        env:
          DSH_PORTABLE_BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          DSH_PORTABLE_NPM_REGISTRY: https://registry.npmjs.org
          DSH_GITHUB_ASSET_MIRROR: ''
        run: bash scripts/build-portable-macos-arm64.sh
      - name: Upload macOS assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
          gh release upload "$TAG" dist/* --clobber

  publish:
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for platform in win-x64-unsigned-manual mac-arm64-adhoc-manual; do
            artifact="deepseek-harness-overlay-${BUILD_VERSION}-${platform}.zip"
            grep -Fx "$artifact" <<<"$assets"
            grep -Fx "$artifact.sha256" <<<"$assets"
            grep -Fx "$artifact.build.json" <<<"$assets"
          done
          dmg="deepseek-harness-overlay-${BUILD_VERSION}-mac-arm64-adhoc-manual.dmg"
          grep -Fx "$dmg" <<<"$assets"
          grep -Fx "$dmg.sha256" <<<"$assets"
          grep -Fx "$dmg.build.json" <<<"$assets"
          exe="deepseek-harness-overlay-${BUILD_VERSION}-win-x64-unsigned-manual.exe"
          grep -Fx "$exe" <<<"$assets"
          grep -Fx "$exe.sha256" <<<"$assets"
          grep -Fx "$exe.build.json" <<<"$assets"
          test "$(wc -l <<<"$assets" | tr -d ' ')" = 12
      - name: Download assets and verify SHA-256 records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          gh release download "$TAG" --dir "$work"
          export RELEASE_ASSET_DIR="$work"
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, os
          work = Path(os.environ['RELEASE_ASSET_DIR'])
          checksums = sorted(work.glob('*.sha256'))
          assert checksums, 'missing sha256 sidecars'
          for sidecar in checksums:
              digest, name = sidecar.read_text().split()
              artifact = work / name
              assert artifact.is_file(), name
              actual = hashlib.sha256(artifact.read_bytes()).hexdigest()
              assert actual == digest, name
              record = json.loads(artifact.with_name(artifact.name + '.build.json').read_text())
              assert record['sha256'] == digest
              assert record['officialCommit']
              assert record['buildVersion']
              assert record['update'] == 'manual'
          print('verified', len(checksums), 'artifacts')
          PY
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease
