name: enterprise-core

on:
  push:
  pull_request:

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python tools/enterprise_gate.py --output-dir /tmp/his-harness-enterprise-gate
      - run: python tools/build_release_bundle.py --output-dir /tmp/his-harness-release
